<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AQUORA · Wasserlaufband</title>
<meta name="theme-color" content="#EEF3F6">
<meta name="description" content="Therapiejournal für das Wasserlaufband">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AQUORA">
<style>
:root{
  --page:#EEF3F6; --surface:#fff; --sunk:#F6FAFC;
  --ink:#232A2F; --ink2:#46545D; --ink3:#5F6E78;
  --hair:#CDDBE3; --water:#A9CBE0; --deep:#5C93B6;
  --brass:#A97C3F; --up:#3F7A6A; --down:#9B5B4B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--ink);
  font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1,h2,h3,h4{margin:0}
.tab{font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:14px;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:74px;height:auto}
@media(min-width:640px){.brand img{width:92px}}
.wordmark{font-size:20px;font-weight:600;letter-spacing:.22em}
@media(min-width:640px){.wordmark{font-size:22px;letter-spacing:.3em}}
.tagline{margin-top:4px;font-size:14px;color:var(--ink3);letter-spacing:.04em}
@media(min-width:640px){.tagline{letter-spacing:.12em}}

button{font:inherit;font-weight:500;min-height:48px;padding:12px 16px;border:1px solid var(--hair);
  border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
input[type=range],.slide .lb,.tabbar,.picks{touch-action:manipulation}
.slide .lb,.tabbar button span,.pick span{-webkit-user-select:none;user-select:none}
button.solid{background:var(--ink);border-color:var(--ink);color:#fff}
button.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
button.danger{color:var(--down);border-color:#E4CFCB}
button.sm{min-height:40px;padding:8px 12px;font-size:15px}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--deep);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px}

label.f{display:block}
label.f>span.lb{display:block;margin-bottom:6px;font-size:14px;color:var(--ink3)}
input[type=text],input[type=number],textarea,select{
  width:100%;padding:12px;font-size:16px;font-family:inherit;color:var(--ink);
  background:var(--sunk);border:1px solid var(--hair);border-radius:10px}
textarea{resize:vertical}
input[type=range]{width:100%;height:36px;accent-color:var(--deep)}
input[type=number]{max-width:210px}
.datewrap{display:flex;align-items:center;gap:8px}
.datewrap input.dateinp{max-width:170px}
.calbtn{position:relative;flex:0 0 auto;width:52px;height:52px;border:1px solid var(--hair);
  border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center}
.calbtn svg{width:24px;height:24px;fill:none;stroke:var(--ink2);stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.calbtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;padding:0;
  background:transparent;font-size:16px}
.hint.err{color:#8A2222}
.warnbox{background:#FBF1E4;border:1px solid #EEDCC2;color:#7A5520;border-radius:12px;
  padding:12px 14px;font-size:15px;margin:-8px 0 20px;max-width:70ch}
.hint{display:block;margin-top:6px;font-size:14px;color:var(--ink3)}
.check{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 12px;
  background:var(--sunk);border:1px solid var(--hair);border-radius:10px;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--deep);flex:0 0 auto}
.check span{font-size:16px}
.hint.warn{color:#8A5A22}

.panel{position:relative;background:var(--surface);border:1px solid var(--hair);
  border-radius:14px;padding:16px;margin-bottom:20px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:640px){.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:1fr 1fr 1fr}}
.layout{display:flex;flex-direction:column;gap:20px}
@media(min-width:940px){
  .layout{flex-direction:row}
  aside.kartei{width:250px;flex:0 0 250px}
  aside.kartei .list{flex-direction:column;overflow:visible}
  .dogbtn{width:100%}
  main.content{flex:1;min-width:0}
}
.list{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.dogbtn{display:flex;align-items:center;gap:12px;flex:0 0 auto;text-align:left;
  border-color:transparent;background:transparent;max-width:100%}
.dogbtn.on{background:var(--surface);border-color:var(--hair);box-shadow:inset 3px 0 0 var(--deep)}
.dogbtn .nm{font-size:16px;font-weight:500;display:block}
.dogbtn.on .nm{font-weight:600}
.dogbtn .sb{display:block;font-size:14px;color:var(--ink3)}

.ava{position:relative;flex:0 0 auto;border-radius:50%;overflow:hidden;border:1px solid var(--hair)}
.ava span{position:absolute;inset:0}
.ava span.half{left:50%}
.ava img{position:absolute;left:6%;top:26%;width:88%}

.tank{position:relative;height:150px;border:1px solid var(--hair);border-radius:12px;
  background:var(--sunk);overflow:hidden}
.tank .dog{position:absolute;left:50%;top:14%;height:52%;width:auto;max-width:82%;
  transform:translateX(-50%);opacity:.55}
.tank .lvl{position:absolute;left:0;right:0;bottom:0;background:var(--water);opacity:.66;
  border-top:2px solid var(--deep);transform-origin:bottom;animation:fill .7s cubic-bezier(.2,.7,.3,1) both}
.tank .bed{position:absolute;left:0;right:0;border-top:2px dashed var(--ink);opacity:.45}
.tank .cap{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;
  padding:0 12px 9px;font-size:14px;text-shadow:0 1px 2px rgba(255,255,255,.65)}
@keyframes fill{from{transform:scaleY(.2);opacity:.2}to{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){.tank .lvl{animation:none}}

.metrics{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);
  border:1px solid var(--hair);border-radius:14px;margin-bottom:20px;overflow:hidden}
@media(min-width:640px){.metrics{grid-template-columns:repeat(4,1fr)}}
.metrics>div{padding:14px 16px;border-top:1px solid var(--hair);border-left:1px solid var(--hair)}
.metrics>div:nth-child(-n+2){border-top:none}
.metrics>div:nth-child(odd){border-left:none}
@media(min-width:640px){
  .metrics>div{border-top:none}
  .metrics>div:nth-child(odd){border-left:1px solid var(--hair)}
  .metrics>div:first-child{border-left:none}
}
.metrics .v{font-size:24px;font-weight:600}
.metrics .u{font-size:14px;color:var(--ink3);margin-left:3px}
.metrics .l{margin-top:2px;font-size:14px;color:var(--ink3)}

.unit{background:var(--sunk);border-radius:12px;padding:14px;margin-bottom:12px}
.unit .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.unit .hd b{font-size:16px}
.unit .hd span{font-size:14px;color:var(--ink2)}
label.f.slide>span.lb{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
label.f.slide>span.lb>span:first-child{font-size:14px;color:var(--ink3)}
label.f.slide>span.lb>span:last-child{font-size:17px;font-weight:600}
.srow{display:flex;align-items:center;gap:10px}
.srow input[type=range]{flex:1}
.stepb{min-height:44px;width:46px;padding:0;font-size:22px;line-height:1;font-weight:400;
  background:var(--surface);color:var(--ink);flex:0 0 auto}

.sumline{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:16px;padding-top:14px;
  border-top:1px solid var(--hair);font-size:16px}

.sess{display:flex;gap:14px;padding:16px;border-top:1px solid var(--hair)}
.sess:first-child{border-top:none}
.sess .day{flex:0 0 48px;text-align:center}
.sess .day b{display:block;font-size:20px;line-height:1.1;font-weight:600}
.sess .day span{font-size:14px;color:var(--ink3)}
.sess .bd{min-width:0;flex:1}
.sess .tot{font-size:16px;color:var(--ink2)}
.sess .det{margin-top:4px;font-size:14px;color:var(--ink3)}
.sess p{margin:8px 0 0;max-width:62ch}

.chart{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:14px}
.chart .ct{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-bottom:6px}
.chart h4{font-size:17px;font-weight:600}
.chart .rf{font-size:14px;color:var(--brass)}
.chart svg{display:block;width:100%;height:auto}
.foot{margin:32px 0 8px;font-size:14px;color:var(--ink3);max-width:70ch}
.empty{max-width:60ch;color:var(--ink2)}

/* Toast mit Rueckgaengig */
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);
  display:none;align-items:center;gap:14px;max-width:calc(100vw - 32px);
  background:#1B2227;color:#fff;border-radius:12px;padding:12px 14px;font-size:15px;
  box-shadow:0 8px 28px rgba(20,30,38,.28);z-index:50}
.toast.on{display:flex}
.toast button{min-height:38px;padding:6px 12px;background:transparent;border:1px solid #4A585F;
  color:#fff;border-radius:8px;font-size:15px}

/* Stoppuhr */
.timer{margin-top:14px;padding:14px;background:var(--surface);border:1px solid var(--hair);border-radius:12px}
.timer .th{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.timer .tv{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.timer .ts{font-size:14px;color:var(--ink3)}
.pool{position:relative;height:70px;margin:12px 0;border-radius:10px;overflow:hidden;
  background:linear-gradient(180deg,#F7FBFD 0%,#F7FBFD 30%,#C4DCEB 30%,#A2C7DE 100%)}
.pool .swim{position:absolute;left:50%;top:12%;height:56%;width:auto;max-width:60%;
  transform:translateX(-50%);opacity:.6}
.pool .wave{position:absolute;left:-60%;right:-60%;bottom:0;height:70%;
  background:repeating-linear-gradient(100deg,rgba(255,255,255,.34) 0 3px,rgba(255,255,255,0) 3px 26px)}
.pool.run .swim{animation:bob .62s ease-in-out infinite alternate}
.pool.run .wave{animation:drift 1.6s linear infinite}
.pool.rest{background:linear-gradient(180deg,#FBF8F2 0%,#F4EDE0 55%,#E9DFCB 100%)}
.pool.rest .wave{display:none}
.pool.rest .swim{left:44%;top:16%;opacity:.45}
.pool.rest.run .swim{animation:breathe 3.4s ease-in-out infinite alternate}
.zzz{position:absolute;right:14%;top:8%;display:none;font-size:17px;letter-spacing:.14em;
  color:#9C8B6E;font-weight:600}
.pool.rest .zzz{display:block}
.pool.rest .zzz span{display:inline-block;opacity:.25}
.pool.rest.run .zzz span{animation:zzz 2.4s ease-in-out infinite}
.pool.rest.run .zzz span:nth-child(2){animation-delay:.4s}
.pool.rest.run .zzz span:nth-child(3){animation-delay:.8s}
@keyframes breathe{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.035)}}
@keyframes zzz{0%{opacity:.15;transform:translateY(4px)}45%{opacity:.9;transform:translateY(-4px)}100%{opacity:.15;transform:translateY(-10px)}}
@keyframes bob{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(-5px)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(26px)}}
.pool .bar{position:absolute;left:0;top:0;height:4px;background:var(--deep);opacity:.9;
  border-bottom-right-radius:4px;transition:width .25s linear}
@media(prefers-reduced-motion:reduce){.pool.run .swim,.pool.run .wave,.pool.rest.run .zzz span{animation:none}}

/* Fotos */
.ava img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:none;opacity:1}
.fotorow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.picks{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:auto;
  padding:10px 12px;min-width:100px;border:1px solid var(--hair);border-radius:12px;background:var(--surface)}
.pick.on{border-color:var(--deep);box-shadow:inset 0 0 0 1px var(--deep)}
.pick span.lbl{font-size:14px;color:var(--ink2)}
.pick.on span.lbl{color:var(--deep);font-weight:600}
.ava.ph{display:flex;align-items:center;justify-content:center;border-style:dashed;
  color:var(--ink3);font-size:26px;font-weight:300;background:var(--sunk)}
.thumb{width:60px;height:60px;object-fit:cover;border-radius:9px;border:1px solid var(--hair);
  flex:0 0 auto;cursor:pointer;background:var(--sunk)}
.shotbox{margin-top:14px;padding:14px;background:var(--surface);border:1px solid var(--hair);border-radius:12px}
.shotbox img{width:100%;max-width:340px;border-radius:10px;display:block;margin-bottom:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp figure{margin:0}
.cmp img{width:100%;border-radius:10px;display:block;background:var(--sunk);cursor:pointer}
.cmp figcaption{margin-top:6px;font-size:14px;color:var(--ink3)}
/* Signal: der ganze Bildschirm leuchtet auf */
.flash{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  text-align:center;padding:24px}
.flash.on{display:flex;flex-direction:column;gap:14px;animation:pulse 1.9s ease-out both}
.flash.loop{animation:blink .9s ease-in-out infinite}
.flash b{font-size:clamp(28px,8.5vw,46px);font-weight:700;letter-spacing:.04em;color:#12201A;
  text-shadow:0 1px 0 rgba(255,255,255,.6);line-height:1.12;max-width:12ch}
.flash small{font-size:16px;color:#38504A;letter-spacing:.08em}
@keyframes pulse{
  0%{opacity:0} 6%{opacity:1} 22%{opacity:.25} 38%{opacity:1}
  54%{opacity:.25} 70%{opacity:1} 100%{opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.32}}
@media(prefers-reduced-motion:reduce){.flash.on,.flash.loop{animation:none;opacity:1}}

.lightbox{position:fixed;inset:0;background:rgba(18,24,28,.88);display:none;z-index:60;
  align-items:center;justify-content:center;padding:16px}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:84vh;border-radius:12px}

/* Menueband unten */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--hair);
  padding-bottom:env(safe-area-inset-bottom)}
.tabbar.hide{display:none}
.tabbar button{min-height:60px;border:none;border-radius:0;background:transparent;color:var(--ink3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500}
.tabbar button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--deep)}
.tabbar button.on svg{stroke-width:2.1}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
.toast{bottom:calc(84px + env(safe-area-inset-bottom))}

/* Kopfzeile */
.top2{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-bottom:12px;margin-bottom:16px;border-bottom:1px solid var(--hair)}
.top2 .b{display:flex;align-items:center;gap:10px}
.top2 img.mk{width:62px}
.top2 .wm{font-size:17px;font-weight:600;letter-spacing:.24em}
.dogchip{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;min-height:46px;
  border:1px solid var(--hair);border-radius:999px;background:var(--surface);font-size:15px;font-weight:500}
.hero{text-align:center;margin:4px 0 22px}
.hero img{width:min(300px,64vw);height:auto;display:block;margin:0 auto}
.hero .cl{margin-top:10px;font-size:13px;letter-spacing:.22em;color:var(--ink3);text-transform:uppercase}
.pagetitle{font-size:20px;font-weight:600;margin-bottom:4px}
.pagesub{font-size:15px;color:var(--ink3);margin:0 0 16px}

/* Vollbild-Formular */
.formhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.formhead h3{font-size:19px;font-weight:600}
.formhead .sub{font-size:14px;color:var(--ink3)}
.stickyact{position:sticky;bottom:0;background:var(--page);padding:12px 0 4px;margin-top:8px;
  border-top:1px solid var(--hair)}

/* Kartei als Liste */
.dogrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px;
  background:var(--surface);border:1px solid var(--hair);border-radius:12px;margin-bottom:10px}
.dogrow.on{box-shadow:inset 4px 0 0 var(--deep)}
.dogrow .nm{font-size:17px;font-weight:600;display:block}
.dogrow .sb{font-size:14px;color:var(--ink3);display:block}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:13px;
  background:#FBF1E4;color:#8A5A22;border:1px solid #EEDCC2}

#report{display:none}
@media print{
  body{background:#fff}
  .wrap>*:not(#report){display:none!important}
  #report{display:block}
  #report table{width:100%;border-collapse:collapse}
  #report th,#report td{border:1px solid #999;padding:5px 7px;font-size:11pt;text-align:left}
  #report th{background:#eee}
  #report img{width:26mm}
  @page{margin:14mm}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
  <div id="report"></div>
</div>
<nav class="tabbar" id="nav">
  <button data-act="tab" data-tab="kartei">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/></svg>
    <span>Kartei</span></button>
  <button data-act="tab" data-tab="erfassen">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M12 8v8M8 12h8"/></svg>
    <span>Erfassen</span></button>
  <button data-act="tab" data-tab="verlauf">
    <svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>
    <span>Verlauf</span></button>
  <button data-act="tab" data-tab="daten">
    <svg viewBox="0 0 24 24"><path d="M12 4v10"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/></svg>
    <span>Daten</span></button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="application/json" hidden>
<input type="file" id="photo" accept="image/*" hidden>
<input type="file" id="photoCam" accept="image/*" capture="environment" hidden>
<input type="file" id="shot" accept="image/*" hidden>
<input type="file" id="shotCam" accept="image/*" capture="environment" hidden>
<input type="file" id="csv" accept=".csv,text/csv" hidden>
<div class="lightbox" id="lightbox"><img alt=""></div>

const COATS = [
  ["schwarz","#2B2E31"],["black","#2B2E31"],["weiss","#EFEDE6"],["weiß","#EFEDE6"],["white","#EFEDE6"],
  ["creme","#E8D9BC"],["champagne","#E0D2B6"],["blond","#DFC189"],["golden","#C99A4E"],["gold","#C99A4E"],
  ["beige","#D8C6A6"],["semmel","#D8C6A6"],["weizen","#DCC7A0"],["wheaten","#DCC7A0"],["falb","#C9AE82"],
  ["isabell","#CBB48E"],["sand","#D9BE93"],["apricot","#DDB07A"],["hellbraun","#B07E4E"],["braun","#7A5230"],
  ["schoko","#5A3A22"],["leber","#6B4226"],["rot","#A65A32"],["fuchs","#B4693A"],["silber","#B9C0C4"],
  ["blaugrau","#9AA6AC"],["grau","#8E979D"],["merle","#9AA6AC"],["gestromt","#5B4632"],["brindle","#5B4632"],
  ["tricolor","#2B2E31"]
];
function coats(farbe){
  let t = (farbe||"").toLowerCase();
  const hits = [];
  for (const [w,hex] of [...COATS].sort((a,b)=>b[0].length-a[0].length)){
    const i = t.indexOf(w);
    if (i < 0) continue;
    t = t.slice(0,i) + " ".repeat(w.length) + t.slice(i+w.length);
    if (!hits.some(h=>h.hex===hex)) hits.push({i,hex});
  }
  hits.sort((a,b)=>a.i-b.i);
  return hits.length ? hits.slice(0,2).map(h=>h.hex) : ["#A9CBE0"];
}
const lumi = hex => {
  const n = parseInt(hex.slice(1),16);
  return (((n>>16)&255)*.299 + ((n>>8)&255)*.587 + (n&255)*.114)/255;
};

/* ---------- Rechenkern ----------
   Skalenwert 1–10 → km/h = Skala / 2 (Faktor bestätigt).
   Strecke [km] = km/h / 60 × Minuten.
   Steigung ist echte Prozent → Steigmeter = Strecke [m] × Steigung / 100.
   Die Bandlänge ändert sich durch die Neigung nicht, die Strecke bleibt Bandweg. */
const kmh = s => Number(s)/2;
const bKm = b => (kmh(b.speed)/60)*Number(b.dauer);
const bHm = b => bKm(b)*1000*(Number(b.steigung)/100);
function totals(s){
  const dauer = s.blocks.reduce((a,b)=>a+Number(b.dauer||0),0);
  const pause = s.blocks.reduce((a,b)=>a+Number(b.pause||0),0);
  const km = s.blocks.reduce((a,b)=>a+bKm(b),0);
  const hm = s.blocks.reduce((a,b)=>a+bHm(b),0);
  return {dauer,pause,km,hm,speed: dauer>0 ? km/(dauer/60) : 0};
}
const fmt = (n,d=2) => (Math.round(Number(n)*10**d)/10**d).toFixed(d);

/* Datum: Anzeige und Eingabe strikt tt.mm.jjjj, gespeichert wird jjjj-mm-tt. */
function deToIso(v){
  const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(String(v||"").trim());
  if (!m) return null;
  const [, d, mo, y] = m;
  const dt = new Date(+y, +mo-1, +d);
  if (dt.getDate() !== +d || dt.getMonth() !== +mo-1 || dt.getFullYear() !== +y) return null;
  if (+y < 1990 || +y > 2100) return null;
  return `${y}-${mo}-${d}`;
}
function maskDate(v){
  const n = String(v||"").replace(/\D/g,"").slice(0,8);
  let out = n.slice(0,2);
  if (n.length > 2) out += "." + n.slice(2,4);
  if (n.length > 4) out += "." + n.slice(4,8);
  return out;
}

/* ---------- Sitzungsbilder ----------
   Text bleibt im kleinen Speicher, Bilder liegen als Blob in IndexedDB.
   Schluessel ist die Sitzungs-ID. */
let idb = null;
function db(){
  return new Promise((res, rej) => {
    if (idb) return res(idb);
    const r = indexedDB.open("aquora", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("shots");
    r.onsuccess = () => { idb = r.result; res(idb); };
    r.onerror = () => rej(r.error);
  });
}
function idbOp(mode, fn){
  return db().then(d => new Promise((res, rej) => {
    const t = d.transaction("shots", mode), st = t.objectStore("shots");
    const rq = fn(st);
    t.oncomplete = () => res(rq ? rq.result : undefined);
    t.onerror = () => rej(t.error);
  }));
}
const shotPut = (id, blob) => idbOp("readwrite", st => st.put(blob, id));
const shotGet = id => idbOp("readonly", st => st.get(id));
const shotDel = id => idbOp("readwrite", st => st.delete(id));
const shotKeys = () => idbOp("readonly", st => st.getAllKeys());

const shotURL = {};                       // id -> object URL, damit Bilder nicht mehrfach geladen werden
async function shotSrc(id){
  if (shotURL[id]) return shotURL[id];
  const blob = await shotGet(id);
  if (!blob) return null;
  shotURL[id] = URL.createObjectURL(blob);
  return shotURL[id];
}
function shotForget(id){
  if (shotURL[id]){ URL.revokeObjectURL(shotURL[id]); delete shotURL[id]; }
}
async function hydrateShots(){                 // nach jedem Aufbau die Bilder nachladen
  for (const el of document.querySelectorAll("[data-shot]")){
    if (el.getAttribute("src")) continue;
    const src = await shotSrc(el.dataset.shot);
    if (src) el.src = src; else el.remove();
  }
}
/* Bild verkleinern: lange Kante 800 px, JPEG. Rund 70 KB pro Aufnahme. */
function shrink(file, max, q){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const f = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * f); cv.height = Math.round(img.height * f);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(img.src);
      cv.toBlob(b => b ? res(b) : rej(new Error("leer")), "image/jpeg", q);
    };
    img.onerror = () => rej(new Error("Bild nicht lesbar"));
    img.src = URL.createObjectURL(file);
  });
}
const blobToData = blob => new Promise(res => {
  const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob);

function chart(title, pts, unit, refY){
  const vals = pts.filter(p => p.v != null);
  if (vals.length < 2) return "";
  const W = 360, H = 190, P = {l:44,r:10,t:12,b:26};
  let lo = Math.min(...vals.map(p=>p.v)), hi = Math.max(...vals.map(p=>p.v));
  if (refY != null){ lo = Math.min(lo,refY); hi = Math.max(hi,refY); }
  if (lo === hi){ lo -= 1; hi += 1; }
  const pad = (hi-lo)*.12; lo -= pad; hi += pad;
  const X = i => P.l + i*(W-P.l-P.r)/Math.max(1,pts.length-1);
  const Y = v => P.t + (1-(v-lo)/(hi-lo))*(H-P.t-P.b);
  let g = "";
  for (let k=0;k<=2;k++){
    const v = lo + (hi-lo)*k/2, y = Y(v);
    g += `<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="var(--hair)"/>
          <text x="${P.l-6}" y="${y+4}" text-anchor="end" font-size="12" fill="var(--ink3)">${fmt(v, hi-lo<3?1:0)}</text>`;
  }
  const idx = pts.length <= 4 ? pts.map((_,i)=>i) : [0, Math.floor((pts.length-1)/2), pts.length-1];
  let xl = idx.map((i,k) => {
    const anchor = k === 0 ? "start" : (k === idx.length-1 ? "end" : "middle");
    return `<text x="${X(i)}" y="${H-6}" text-anchor="${anchor}" font-size="12" fill="var(--ink3)">${pts[i].label}</text>`;
  }).join("");
  const line = pts.map((p,i)=> p.v==null ? null : `${X(i)},${Y(p.v)}`).filter(Boolean).join(" ");
  const dots = pts.map((p,i)=> p.v==null ? "" : `<circle cx="${X(i)}" cy="${Y(p.v)}" r="3.5" fill="var(--deep)"><title>${p.label}: ${fmt(p.v)} ${unit}</title></circle>`).join("");
  const ref = refY == null ? "" :
    `<line x1="${P.l}" y1="${Y(refY)}" x2="${W-P.r}" y2="${Y(refY)}" stroke="var(--brass)" stroke-dasharray="3 4"/>`;
  return `<div class="chart">
    <div class="ct"><h4>${title}</h4>${refY!=null?`<span class="rf tab">Start ${fmt(refY)} ${unit}</span>`:""}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">
      ${g}${ref}<polyline points="${line}" fill="none" stroke="var(--deep)" stroke-width="2.2"/>${dots}${xl}
    </svg></div>`;
}

  const kmT = d.sessions.reduce((a,s2)=>a+totals(s2).km,0);
  const minT = d.sessions.reduce((a,s2)=>a+totals(s2).dauer,0);
  const fw = ch.find(p=>p.gewicht!=null), lw = [...ch].reverse().find(p=>p.gewicht!=null);
  const dw = fw && lw ? lw.gewicht - fw.gewicht : null;

  let h = `<div class="pagetitle">${esc(d.name)}</div>
    <p class="pagesub">${d.sessions.length ? d.sessions.length + " Sitzungen" : "Noch keine Sitzung"}</p>`;

  if (!d.sessions.length) return h + `<div class="panel"><p class="empty">Sobald zwei Sitzungen erfasst
    sind, erscheinen hier die Kurven und der Bildvergleich.</p>
    <div class="row" style="margin-top:14px"><button class="solid" data-act="new-session">Erste Sitzung erfassen</button></div></div>`;

  h += `<div class="metrics">
    <div><span class="v tab">${d.sessions.length}</span><div class="l">Sitzungen</div></div>
    <div><span class="v tab">${minT}</span><span class="u">min</span><div class="l">Laufzeit total</div></div>
    <div><span class="v tab">${fmt(kmT,2)}</span><span class="u">km</span><div class="l">Strecke total</div></div>
    <div><span class="v tab" style="color:${dw==null||dw===0?"var(--ink3)":(dw<0?"var(--up)":"var(--down)")}">${
      dw==null?"–":(dw>0?"+":"")+fmt(dw,1)}</span>${dw==null?"":'<span class="u">kg</span>'}
      <div class="l">Gewicht seit Start</div></div>
  </div>`;

  if (summary(d)) h += `<div class="panel" style="padding:14px 16px"><p style="margin:0;max-width:70ch">${esc(summary(d))}</p></div>`;

  const mitBild = [...d.sessions].filter(x => x.bild).sort((a,b)=>a.datum.localeCompare(b.datum));
  if (mitBild.length > 1){
    const a0 = mitBild[0], a1 = mitBild[mitBild.length-1];
    h += `<div class="panel"><h3 style="font-size:17px;margin-bottom:12px">Bildvergleich</h3>
      <div class="cmp">
        <figure><img data-shot="${a0.id}" data-act="zoom" data-id="${a0.id}" alt="">
          <figcaption>Erste Aufnahme · ${de(a0.datum)}${a0.gewicht?" · "+a0.gewicht+" kg":""}</figcaption></figure>
        <figure><img data-shot="${a1.id}" data-act="zoom" data-id="${a1.id}" alt="">
          <figcaption>Neueste · ${de(a1.datum)}${a1.gewicht?" · "+a1.gewicht+" kg":""}</figcaption></figure>
      </div></div>`;
  }

  if (ch.length > 1){
    const lo = Math.min(...ch.map(p=>p.tief)), hi = Math.max(...ch.map(p=>p.tief));
    const gs = d.sessions.filter(x => x.gegenstrom).length;
    if (gs > 0 && gs < d.sessions.length) h += `<div class="warnbox">${gs} von ${d.sessions.length}
      Sitzungen liefen mit Gegenstromanlage. Der zusätzliche Widerstand erhöht die Muskelarbeit erheblich,
      ohne die zurückgelegte Strecke zu verändern. Vergleiche nur Sitzungen mit gleicher Einstellung.</div>`;
    if (hi !== lo) h += `<div class="warnbox">Die Eintauchtiefe lag zwischen ${nf(lo)} und ${nf(hi)}.
      Strecke und Dauer sind dadurch nicht direkt vergleichbar: bei tieferem Wasser trägt der Auftrieb
      mehr Gewicht, gleichzeitig steigt der Wasserwiderstand. Vergleiche Sitzungen mit gleicher Tiefe.</div>`;
    h += `<div class="grid c2" style="margin-bottom:20px">
      ${chart("Gewicht", ch.map(p=>({label:p.label,v:p.gewicht})), "kg", null)}
      ${chart("Strecke pro Sitzung", ch.map(p=>({label:p.label,v:p.km})), "km", ch[0].km)}
      ${chart("Laufdauer", ch.map(p=>({label:p.label,v:p.dauer})), "min", ch[0].dauer)}
      ${chart("Ø Geschwindigkeit", ch.map(p=>({label:p.label,v:p.speed})), "km/h", null)}
      ${chart("Eintauchtiefe (Wasser − Band)", ch.map(p=>({label:p.label,v:p.tief})), "Skala", ch[0].tief)}
      ${chart("Steigmeter", ch.map(p=>({label:p.label,v:p.hm})), "m", null)}
    </div>`;
  }

  h += `<div style="font-size:14px;color:var(--ink3);margin-bottom:10px">Alle Sitzungen</div>
    <div class="panel" style="padding:0">${[...d.sessions].sort((a,b)=>b.datum.localeCompare(a.datum))
      .map((x,i)=>sessRow(x, d, i===0)).join("")}</div>`;
  return h;
}

/* eine Zeile im Verlauf */

  return `<div class="sess"${erste?' style="border-top:none"':""}>
    <div class="day"><b class="tab">${p[2]}</b><span>${MON[+p[1]-1]} ${p[0].slice(2)}</span></div>
    <div class="bd">

      ${s2.entwurf || s2.gegenstrom ? "<br>" : ""}
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px">
        ${s2.bild ? `<img class="thumb" data-shot="${s2.id}" data-act="zoom" data-id="${s2.id}" alt="">` : ""}
        ${profile(s2.blocks)}
        <span class="tot tab">${t.dauer} min · ${fmt(t.km,3)} km · ${fmt(t.hm,1)} Hm · Tiefe ${nf(tiefe(s2.wasserhoehe,s2.laufbandhoehe))}${s2.gewicht?" · "+s2.gewicht+" kg":""}</span>
      </div>
      <div class="det tab">${s2.blocks.map(b=>`${nf(kmh(b.speed))} km/h ${b.steigung}% ${b.dauer}′`).join("  ·  ")}${s2.therapeut?" — "+esc(s2.therapeut):""}</div>

function sessionForm(){
  const d = cur(), s = draft, t = totals(s), exists = d.sessions.some(x => x.id === s.id);
  const prev = [...d.sessions].filter(x => x.id !== s.id && x.datum <= s.datum)
    .sort((a,b)=>b.datum.localeCompare(a.datum))[0];
  const pw = prev ? Number(prev.gewicht) : 0, cw = Number(s.gewicht);
  const dlt = pw && cw ? cw - pw : null;
  const hint = dlt == null ? "" :
    `<span class="hint${Math.abs(dlt)/pw > .1 ? " warn" : ""}" data-out="whint">${(dlt>0?"+":"")+fmt(dlt,1)} kg seit ${de(prev.datum)}${Math.abs(dlt)/pw>.1?" – über 10 %, Wert prüfen":""}</span>`;

  let h = `<div class="panel">
    <div class="formhead"><div><h3>Sitzung ${exists?"bearbeiten":"erfassen"}</h3>
      <span class="sub">${esc(d.name)}${s.entwurf?" · Entwurf":""}</span></div></div>
    <div class="grid c3">
      ${dateField("Datum", s.datum, "datum", datumHinweis(s, d))}
      <label class="f"><span class="lb">Gewicht heute (kg)</span>
        <input type="number" step="0.1" inputmode="decimal" value="${esc(s.gewicht)}" data-set="gewicht">${hint}</label>
      ${txt("Behandelt durch", s.therapeut, "therapeut", "text", "Name")}
      <div class="grid c2" style="gap:12px;align-self:center">
        ${slider("Bandhöhe", s.laufbandhoehe, 0, 20, "", "laufbandhoehe", 0.5)}
        ${slider("Wasserhöhe", s.wasserhoehe, 0, 20, "", "wasserhoehe", 0.5)}
        <label class="check" style="grid-column:1/-1">
          <input type="checkbox" data-check="gegenstrom"${s.gegenstrom?" checked":""}>
          <span>Gegenstromanlage eingeschaltet</span>
        </label>
      </div>
      <div id="tankbox">${tank(s.wasserhoehe, s.laufbandhoehe, s.gewicht?s.gewicht+" kg":"")}</div>
    </div>
    <div style="margin-top:18px">`;

  s.blocks.forEach((b,i) => {
    h += `<div class="unit">
      <div class="hd"><b>Einheit ${i+1}</b><span class="tab" data-out="b${i}">${nf(kmh(b.speed))} km/h · ${fmt(bKm(b),3)} km · ${fmt(bHm(b),1)} Hm</span></div>
      <div class="grid c2" style="gap:14px">
        ${slider("Geschwindigkeit", b.speed, 1, 10, "", i+".speed", 0.25)}
        ${slider("Steigung", b.steigung, 0, 15, " %", i+".steigung", 1)}
        <div>${slider("Dauer", b.dauer, 1, 30, " min", i+".dauer")}
          ${timerBlock(i, "run", b.dauer)}</div>
        <div>${slider("Pause danach", b.pause, 0, 10, " min", i+".pause")}
          ${timerBlock(i, "rest", b.pause)}</div>
      </div>
      ${s.blocks.length>1?`<div class="row" style="margin-top:10px"><button class="ghost sm" data-act="del-block" data-i="${i}">Einheit entfernen</button></div>`:""}
    </div>`;
  });
  if (s.blocks.length < 3) h += `<button data-act="add-block">Einheit hinzufügen</button>`;
  h += `</div>
    <div class="shotbox">
      <span class="lb" style="display:block;margin-bottom:8px">Bild der Sitzung</span>
      ${s.bild ? `<img data-shot="${s.id}" alt="Aufnahme dieser Sitzung">` : ""}
      <div class="row">
        <button class="sm" data-act="shot-cam">Kamera</button>
        <button class="sm" data-act="shot">Mediathek</button>
        ${s.bild ? `<button class="ghost sm" data-act="shot-del">Bild entfernen</button>` : ""}
      </div>
      <span class="hint">Seitlich aufnehmen, möglichst immer vom gleichen Punkt. Nur so lässt sich der
        Verlauf später vergleichen.</span>
    </div>
    <label class="f" style="margin-top:18px"><span class="lb">Bemerkungen zur Sitzung</span>
      <textarea rows="2" data-set="bemerkungen" placeholder="Verhalten, Auffälligkeiten, Messpunkt Wasserhöhe">${esc(s.bemerkungen)}</textarea></label>
    <div class="sumline tab" data-out="sum">
      <span>${t.dauer} min Laufzeit</span><span>${t.pause} min Pause</span>
      <span>${fmt(t.km,3)} km</span><span>${fmt(t.hm,1)} Steigmeter</span>
      <span style="color:var(--ink3)">Ø ${fmt(t.speed,2)} km/h</span></div>
    <div class="stickyact row">
      <button class="solid" data-act="save-session">Speichern</button>
      <button data-act="save-draft">Später beenden</button>
      <button class="ghost" data-act="discard">${exists?"Abbrechen":"Verwerfen"}</button>
      ${exists?`<button class="ghost" data-act="del-session" data-id="${s.id}">Löschen</button>`:""}
    </div></div>`;
  return h;
}

function series(d){
  return [...d.sessions].sort((a,b)=>a.datum.localeCompare(b.datum)).map(s => {
    const t = totals(s);
    return {label: de(s.datum).slice(0,5), gewicht: Number(s.gewicht)||null, dauer: t.dauer,
      speed: +fmt(t.speed,2), km: +fmt(t.km,3), hm: +fmt(t.hm,1),
      tief: tiefe(s.wasserhoehe, s.laufbandhoehe)};
  });
}

/* ---------- Live-Anzeige im Formular ---------- */
function live(){
  const s = draft;
  document.querySelectorAll("[data-out]").forEach(el => {
    const k = el.dataset.out;
    if (k === "sum" && mode === "session"){
      const t = totals(s);
      el.innerHTML = `<span>${t.dauer} min Laufzeit</span><span>${t.pause} min Pause</span>
        <span>${fmt(t.km,3)} km</span><span>${fmt(t.hm,1)} Steigmeter</span>
        <span style="color:var(--ink3)">Ø ${fmt(t.speed,2)} km/h</span>`;
    } else if (/^b\d+$/.test(k) && mode === "session"){
      const b = s.blocks[+k.slice(1)];
      el.textContent = `${nf(kmh(b.speed))} km/h · ${fmt(bKm(b),3)} km · ${fmt(bHm(b),1)} Hm`;
    }
  });
  const box = document.getElementById("tankbox");
  if (box && mode === "session") box.innerHTML = tank(s.wasserhoehe, s.laufbandhoehe, s.gewicht?s.gewicht+" kg":"");
  const t2 = document.querySelector(".panel .tank");
  if (mode === "dog" && t2) t2.parentElement.innerHTML = "";
}

function setField(attr, val){
  if (attr.includes(".")){
    const [i,k] = attr.split(".");
    draft.blocks[+i][k] = val;
  } else draft[attr] = val;
}

/* ---------- Stoppuhr ----------
   Optional: manuelle Eingabe über den Schieber bleibt jederzeit möglich. */
let timers = {}, tRun = null, tInt = null, tAlarm = {};
let actx = null, wakeLock = null;

/* Einstellungen fuer das Signal, bleiben auf dem Geraet gespeichert. */
const SIGKEY = "aquora.signal";
let signal = {ton: true, blitz: true, auto: true};
try { Object.assign(signal, JSON.parse(localStorage.getItem(SIGKEY) || "{}")); } catch {}
const signalSave = () => { try { localStorage.setItem(SIGKEY, JSON.stringify(signal)); } catch {} };

/* Bildschirm wach halten, solange eine Uhr laeuft. */
async function wachHalten(an){
  try {
    if (an && !wakeLock && navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen");
    if (!an && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && tRun) wachHalten(true);
});

function flash(text, farbe, dauerhaft){
  if (!signal.blitz) return;
  const el = document.getElementById("flash");
  el.style.background = farbe;
  el.querySelector("b").textContent = text;
  el.querySelector("small").style.visibility = dauerhaft ? "visible" : "hidden";
  el.classList.remove("on", "loop"); void el.offsetWidth;
  el.classList.add("on"); if (dauerhaft) el.classList.add("loop");
  if (!dauerhaft) setTimeout(() => el.classList.remove("on"), 2000);
}
let alarmLoop = null;
function alarmStart(kind){
  alarmStop();
  const spielen = () => {
    if (kind === "run"){
      // aufsteigend, offen: Laufzeit vorbei
      melodie([[659,0,.5,.55],[784,.16,.5,.55],[988,.32,.55,.6],[1319,.52,.9,.62]]);
      flash("LAUFZEIT VORBEI", "#EDF6FA", true);
    } else {
      // ruhiger Zweiklang, wiederholt: Pause fertig
      melodie([[988,0,.55,.55],[740,.24,.55,.55],[988,.62,.5,.5],[740,.86,.9,.55]]);
      flash("PAUSE FERTIG", "#B7E6C4", true);
    }
  };
  spielen();
  alarmLoop = setInterval(spielen, 2300);
}
function alarmStop(){
  if (alarmLoop){ clearInterval(alarmLoop); alarmLoop = null; }
  const el = document.getElementById("flash");
  el.classList.remove("on", "loop");
}
/* Jede Berührung beendet den Alarm, egal wo. */
document.getElementById("flash").addEventListener("pointerdown", e => { e.preventDefault(); alarmStop(); });
document.addEventListener("keydown", () => { if (alarmLoop) alarmStop(); });
/* Kurzes Signal plus Vibration, wenn die eingestellte Zeit erreicht ist. */
/* Kleine Melodie statt eines nackten Piepsers. */
/* Glockenartiger Klang: Grundton, Oktave darüber, Quinte leise dazu. */
function ton(hz, start, dauer, laut){
  [[1, laut], [2, laut*0.42], [3, laut*0.14]].forEach(([f, amp], i) => {
    const t0 = actx.currentTime + start;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = i === 0 ? "triangle" : "sine";
    o.frequency.setValueAtTime(hz * f, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(amp, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dauer);
    o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dauer + 0.03);
  });
}
function melodie(noten){
  if (!signal.ton) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    noten.forEach(([hz, start, dauer, laut]) => ton(hz, start, dauer, laut ?? 0.5));
  } catch {}
}
function audioFreischalten(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    g.gain.value = 0.0001; o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.02);
  } catch {}
}
document.addEventListener("click", audioFreischalten, {once: true});
document.addEventListener("touchstart", audioFreischalten, {once: true});

/* Signal am Ende einer Laufzeit bzw. einer Pause. */
function signalGeben(art){
  if (navigator.vibrate) navigator.vibrate([300, 140, 300, 140, 300]);   // auf iPhones ohne Wirkung
  alarmStart(art);
}   // Schluessel: "<Einheit>:run" oder "<Einheit>:rest"
const tSec = k => (timers[k]||0) + (tRun && tRun.k === k ? (Date.now()-tRun.at)/1000 : 0);
const mmss = sec => String(Math.floor(sec/60)).padStart(2,"0") + ":" + String(Math.floor(sec%60)).padStart(2,"0");
/* Anzeige: Restzeit bis zum Ziel. Ohne Ziel wird vorwaerts gezaehlt. */
function restText(k){
  const sec = tSec(k), soll = tSoll(k);
  if (soll <= 0) return mmss(sec);
  return sec >= soll ? "00:00" : mmss(Math.ceil(soll - sec));
}
const tSoll = k => {
  const [i, kind] = k.split(":");
  return Number(kind === "run" ? draft.blocks[+i].dauer : draft.blocks[+i].pause) * 60;
};

function timerBlock(i, kind, ziel){
  const k = i + ":" + kind, on = tRun && tRun.k === k;
  const rest = kind === "rest";
  return `<div class="timer">
    <div class="th"><span class="tv" data-t="${k}">${restText(k)}</span>
      <span class="ts" data-goal="${k}">${rest ? "Pause" : "Laufzeit"} · Ziel ${ziel} min</span></div>
    <div class="pool${rest ? " rest" : ""}${on ? " run" : ""}" data-pool="${k}">
      <div class="bar" data-bar="${k}" style="width:0%"></div>
      <div class="wave"></div>
      <img class="swim" src="${LOGO}" alt="">
      ${rest ? `<span class="zzz"><span>z</span><span>z</span><span>z</span></span>` : ""}
    </div>
    <div class="row">
      <button class="sm" data-act="t-toggle" data-k="${k}">${on ? "Pause" : "Start"}</button>
      <button class="sm" data-act="t-take" data-k="${k}">Übernehmen</button>
      <button class="ghost sm" data-act="t-reset" data-k="${k}">Null</button>
    </div></div>`;
}
function tick(){
  if (mode !== "session"){ stopTimer(); return; }
  document.querySelectorAll("[data-t]").forEach(el => {
    const k = el.dataset.t, sec = tSec(k);
    el.textContent = restText(k);
    const g = document.querySelector(`[data-goal="${k}"]`);
    if (g && tRun && tRun.k === k){
      const [ix2, kind2] = k.split(":");
      g.textContent = `${kind2 === "run" ? "Laufzeit" : "Pause"} · gelaufen ${mmss(sec)}`;
    }
    const bar = document.querySelector(`[data-bar="${k}"]`);
    const soll = tSoll(k);
    if (bar) bar.style.width = (soll > 0 ? Math.min(100, (sec/soll)*100) : 0) + "%";
    if (soll > 0 && sec >= soll && !tAlarm[k] && tRun && tRun.k === k){
      tAlarm[k] = true;
      const [ix, kind] = k.split(":");
      let weiter = false;
      if (kind === "run" && signal.auto){
        const rk = ix + ":rest";
        if (tSoll(rk) > 0 && !timers[rk]){ timers[rk] = 0; startTimer(rk); weiter = true; }
      }
      signalGeben(kind);
      toast(weiter
        ? `Einheit ${+ix+1}: Laufzeit abgelaufen, die Pause läuft.`
        : `Einheit ${+ix+1}: ${kind === "run" ? "Laufzeit" : "Pause"} von ${nf(soll/60)} min abgelaufen.`);
    }
  });
}
function startTimer(k){
  if (tRun && tRun.k !== k) pauseTimer();
  tAlarm[k] = tSec(k) >= tSoll(k);      // schon drüber? dann nicht nachträglich piepsen
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {}
  tRun = {k, at: Date.now()};
  clearInterval(tInt); tInt = setInterval(tick, 250); tick();
  wachHalten(true);
  const p = document.querySelector(`[data-pool="${k}"]`); if (p) p.classList.add("run");
  const b = document.querySelector(`[data-act="t-toggle"][data-k="${k}"]`); if (b) b.textContent = "Pause";
}
function pauseTimer(){
  if (!tRun) return;
  const k = tRun.k; timers[k] = tSec(k); tRun = null;
  clearInterval(tInt); tInt = null; wachHalten(false); alarmStop();
  const p = document.querySelector(`[data-pool="${k}"]`); if (p) p.classList.remove("run");
  const b = document.querySelector(`[data-act="t-toggle"][data-k="${k}"]`); if (b) b.textContent = "Start";
  tick();
}
function stopTimer(){ clearInterval(tInt); tInt = null; tRun = null; timers = {}; tAlarm = {};
  wachHalten(false); alarmStop(); }

/* ---------- Bericht ---------- */
function summary(d){
  if (d.sessions.length < 2) return "";
  const ss = [...d.sessions].sort((a,b)=>a.datum.localeCompare(b.datum));
  const f = totals(ss[0]), l = totals(ss[ss.length-1]);
  const wf = Number(ss.find(x=>Number(x.gewicht))?.gewicht) || null;
  const wl = Number([...ss].reverse().find(x=>Number(x.gewicht))?.gewicht) || null;
  const pct = f.km > 0 ? Math.round(((l.km - f.km)/f.km)*100) : null;
  const parts = [
    `Über ${ss.length} Sitzungen zwischen ${de(ss[0].datum)} und ${de(ss[ss.length-1].datum)} wurde die Laufdauer von ${f.dauer} auf ${l.dauer} Minuten geführt`,
    pct != null ? `die Strecke pro Sitzung veränderte sich um ${pct>0?"+":""}${pct} Prozent auf ${fmt(l.km,3)} km` : null,
    wf && wl ? `das Gewicht von ${fmt(wf,1)} auf ${fmt(wl,1)} kg` : null,
    `die Eintauchtiefe lag zuletzt bei ${tiefe(ss[ss.length-1].wasserhoehe, ss[ss.length-1].laufbandhoehe)}`
  ].filter(Boolean);
  return parts.join(", ") + ".";
}

function csvAll(){
  const head = ["Hund","Rasse","Datum","Gewicht kg","Wasser","Band","Tiefe","Gegenstrom","Einheiten"];
  for (let i=1;i<=3;i++) head.push(`E${i} km/h`,`E${i} Steigung %`,`E${i} Dauer min`,`E${i} Pause min`);
  head.push("Laufdauer min","Pausen min","Strecke km","Steigmeter","Ø km/h","Behandelt durch","Bemerkungen");
  const rows = [head];
  dogs.forEach(d => [...d.sessions].sort((a,b)=>a.datum.localeCompare(b.datum)).forEach(s => {
    const t = totals(s);
    const r = [d.name, d.rasse, de(s.datum), s.gewicht, s.wasserhoehe, s.laufbandhoehe,
      tiefe(s.wasserhoehe,s.laufbandhoehe), s.gegenstrom ? "ja" : "nein", s.blocks.length];
    for (let i=0;i<3;i++){
      const b = s.blocks[i];
      r.push(b?nf(kmh(b.speed)):"", b?b.steigung:"", b?b.dauer:"", b?b.pause:"");
    }
    r.push(t.dauer, t.pause, fmt(t.km,3), fmt(t.hm,1), fmt(t.speed,2), s.therapeut, (s.bemerkungen||"").replace(/[\r\n]+/g," "));
    rows.push(r);
  }));
  const csv = rows.map((r,ri) => r.map(c => {
    let v = String(c==null?"":c);
    if (ri > 0 && /^-?\d+\.\d+$/.test(v)) v = v.replace(".", ",");
    return /[";]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(";")).join("\r\n");
  return "\uFEFF" + csv;  // BOM, damit Excel die Umlaute richtig liest
}

  if (a === "new-dog"){ draft = newDog(); mode = "dog"; confirmDel = false; }
  else if (a === "tab"){ tab = b.dataset.tab; mode = "view"; draft = null; confirmDel = false; }
  else if (a === "sel"){ sel = b.dataset.id; mode = "view"; tab = "verlauf"; confirmDel = false; }
  else if (a === "edit-dog"){ draft = JSON.parse(JSON.stringify(d)); mode = "dog"; confirmDel = false; }
  else if (a === "toggle-kastriert"){ draft.kastriert = !draft.kastriert; }
  else if (a === "save-dog"){
    if (!draft.name.trim()) { toast("Der Name fehlt."); return; }
    const gf = document.querySelector('[data-date="geb"]');
    if (gf && gf.value.trim() && !deToIso(gf.value)) { toast("Geburtsdatum: bitte tt.mm.jjjj eingeben."); return; }
    draft.geb = gf && gf.value.trim() ? deToIso(gf.value) : "";
    const i = dogs.findIndex(x => x.id === draft.id);
    if (i >= 0) dogs[i] = draft; else dogs.push(draft);
    sel = draft.id; save(); mode = "view"; tab = "erfassen"; draft = null;
  }
  else if (a === "del-dog"){ confirmDel = true; }
  else if (a === "del-dog-yes"){
    const gone = dogs.find(x => x.id === draft.id), idx = dogs.indexOf(gone);
    dogs = dogs.filter(x => x.id !== draft.id); sel = dogs[0] ? dogs[0].id : null;
    save(); mode = "view"; draft = null; confirmDel = false;
    toast(`${gone.name} gelöscht.`, [{label:"Rückgängig", run(){
      dogs.splice(idx, 0, gone); sel = gone.id; save(); render();
    }}]);
  }
  else if (a === "new-session"){ stopTimer(); draft = newSession(d); mode = "session"; }
  else if (a === "step"){
    const attr = b.dataset.attr, st = Number(b.dataset.st), d0 = Number(b.dataset.d);
    const lo = Number(b.dataset.min), hi = Number(b.dataset.max);
    const cur0 = attr.includes(".") ? draft.blocks[+attr.split(".")[0]][attr.split(".")[1]] : draft[attr];
    const dec = String(st).includes(".") ? String(st).split(".")[1].length : 0;
    const next = Math.min(hi, Math.max(lo, +(Number(cur0) + d0).toFixed(dec)));
    setField(attr, next);
    const sl = document.querySelector(`input[data-set="${attr}"]`); if (sl) sl.value = next;
    const out = document.querySelector(`[data-out="${attr}"]`);
    if (out) out.textContent = nf(next) + (b.dataset.unit || "");
    const m = /^(\d+)\.(dauer|pause)$/.exec(attr);
    if (m){
      const k = m[1] + ":" + (m[2] === "dauer" ? "run" : "rest");
      const g = document.querySelector(`[data-goal="${k}"]`);
      if (g) g.textContent = `${m[2] === "dauer" ? "Laufzeit" : "Pause"} · Ziel ${next} min`;
    }
    live(); return;
  }
  else if (a === "t-toggle"){ const k = b.dataset.k; if (tRun && tRun.k === k) pauseTimer(); else startTimer(k); return; }
  else if (a === "t-reset"){
    const k = b.dataset.k;
    if (tRun && tRun.k === k) { clearInterval(tInt); tInt = null; tRun = null; }
    timers[k] = 0; tAlarm[k] = false; alarmStop();
    const p = document.querySelector(`[data-pool="${k}"]`); if (p) p.classList.remove("run");
    const tb = document.querySelector(`[data-act="t-toggle"][data-k="${k}"]`); if (tb) tb.textContent = "Start";
    tick(); return;
  }
  else if (a === "t-take"){
    const k = b.dataset.k, sec = tSec(k), [ix, kind] = k.split(":"), i = +ix;
    if (sec < 5) { toast("Die Uhr läuft noch keine fünf Sekunden."); return; }
    const feld = kind === "run" ? "dauer" : "pause";
    const min = kind === "run" ? Math.min(30, Math.max(1, Math.round(sec/60)))
                               : Math.min(10, Math.max(0, Math.round(sec/60)));
    draft.blocks[i][feld] = min;
    const sl = document.querySelector(`input[data-set="${i}.${feld}"]`);
    if (sl) sl.value = min;
    const out = document.querySelector(`[data-out="${i}.${feld}"]`);
    if (out) out.textContent = min + " min";
    const goal = document.querySelector(`[data-goal="${k}"]`);
    if (goal) goal.textContent = `${kind === "run" ? "Laufzeit" : "Pause"} · Ziel ${min} min`;
    live();
    toast(`Einheit ${i+1}, ${kind === "run" ? "Laufzeit" : "Pause"}: ${mmss(sec)} übernommen als ${min} min.`);
    return;
  }
  else if (a === "pick"){
    draft.bildwahl = b.dataset.w;
    if (b.dataset.w === "foto" && !draft.foto){ render(); document.getElementById("photo").click(); return; }
  }
  else if (a === "foto"){ document.getElementById("photo").click(); return; }
  else if (a === "shot"){ document.getElementById("shot").click(); return; }
  else if (a === "shot-cam"){ document.getElementById("shotCam").click(); return; }
  else if (a === "foto-cam"){ document.getElementById("photoCam").click(); return; }
  else if (a === "shot-del"){
    shotDel(draft.id).catch(()=>{}); shotForget(draft.id); delete draft.bild;
  }
  else if (a === "zoom"){
    const src = shotURL[b.dataset.id];
    if (src){
      const lb = document.getElementById("lightbox");
      lb.querySelector("img").src = src; lb.classList.add("on");
    }
    return;
  }
  else if (a === "foto-del"){
    delete draft.foto;
    if (draft.bildwahl === "foto") draft.bildwahl = portraitFor(draft) ? "portrait" : "scheibe";
  }
  else if (a === "sig-test-run"){ audioFreischalten(); signalGeben("run"); return; }
  else if (a === "sig-test-rest"){ audioFreischalten(); signalGeben("rest"); return; }
  else if (a === "range-all"){ range.aktiv = false; }
  else if (a === "range-on"){ range.aktiv = true; }
  else if (a === "csv-in"){ document.getElementById("csv").click(); return; }
  else if (a === "share"){
    (async () => {
      const dd = gefiltert(d);
      if (!dd.sessions.length){ toast("Im gewählten Zeitraum gibt es keine Sitzungen."); return; }
      const datei = new File([await reportMitBildern(dd)],
        `therapieblatt-${d.name.replace(/[^\wäöüÄÖÜ-]+/g,"_")}-${today()}.html`, {type:"text/html"});
      if (navigator.canShare && navigator.canShare({files:[datei]})){
        try { await navigator.share({files:[datei], title:`Therapieblatt ${d.name}`}); }
        catch { /* abgebrochen */ }
      } else {
        const link = document.createElement("a");
        link.href = URL.createObjectURL(datei); link.download = datei.name; link.click();
        toast("Teilen geht auf diesem Gerät nicht, die Datei wurde gespeichert.");
      }
    })().catch(() => toast("Teilen fehlgeschlagen."));
    return;
  }
  else if (a === "csv"){
    if (!dogs.some(x => x.sessions.length)) { toast("Noch keine Sitzungen zum Auswerten."); return; }
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([csvAll()], {type:"text/csv;charset=utf-8"}));
    link.download = "aquora-sitzungen-" + today() + ".csv"; link.click();
    toast("CSV erstellt. Öffnet sich direkt in Excel.");
    return;
  }
  else if (a === "edit-session"){ stopTimer(); draft = JSON.parse(JSON.stringify(d.sessions.find(s => s.id === b.dataset.id))); mode = "session"; }
  else if (a === "save-draft" || a === "save-session"){
    stopTimer();
    const alsEntwurf = (a === "save-draft");
    const df = document.querySelector('[data-date="datum"]');
    const iso = df ? deToIso(df.value) : null;
    if (!iso) { toast("Datum: bitte tt.mm.jjjj eingeben."); return; }
    draft.datum = iso;
    const i = d.sessions.findIndex(s => s.id === draft.id);
    if (alsEntwurf) draft.entwurf = true; else delete draft.entwurf;
    if (i >= 0) d.sessions[i] = draft; else d.sessions.push(draft);
    save(); mode = "view"; tab = alsEntwurf ? "erfassen" : "verlauf"; draft = null;
    toast(alsEntwurf ? "Als Entwurf gesichert, du kannst sie später fortsetzen." : "Sitzung gespeichert.");
  }
  else if (a === "discard"){
    stopTimer();
    const bestand = d.sessions.some(x => x.id === draft.id);
    if (!bestand && draft.bild){ shotDel(draft.id).catch(()=>{}); shotForget(draft.id); }
    mode = "view"; draft = null;
  }
  else if (a === "del-session"){
    const gone = d.sessions.find(s => s.id === b.dataset.id), dogId = d.id;
    if (mode === "session"){ stopTimer(); mode = "view"; draft = null; }
    d.sessions = d.sessions.filter(s => s.id !== b.dataset.id); save();
    toast(`Sitzung vom ${de(gone.datum)} gelöscht.`, [{label:"Rückgängig", run(){
      const dd = dogs.find(x => x.id === dogId); if (dd){ dd.sessions.push(gone); save(); render(); }
    }}]);
  }
  else if (a === "add-block"){ draft.blocks.push(newBlock()); }
  else if (a === "del-block"){ draft.blocks.splice(+b.dataset.i, 1); }
  else if (a === "cancel"){ stopTimer(); mode = "view"; draft = null; confirmDel = false; }
  else if (a === "export"){
    toast("Sicherung wird erstellt, Bilder werden mitgenommen.");
    (async () => {
      const bilder = {};
      for (const dd of dogs) for (const ss of dd.sessions){
        if (!ss.bild) continue;
        const blob = await shotGet(ss.id);
        if (blob) bilder[ss.id] = await blobToData(blob);
      }
      const paket = {aquora: 2, erstellt: new Date().toISOString(), hunde: dogs, bilder};
      const txt = JSON.stringify(paket);
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([txt], {type:"application/json"}));
      link.download = "aquora-daten-" + today() + ".json"; link.click();
      try { localStorage.setItem(EXPKEY, String(Date.now())); } catch {}
      toast(`Sicherung erstellt, ${Math.round(txt.length/1024/1024*10)/10} MB.`);
      if (mode === "view" && tab === "daten") render();
    })().catch(() => toast("Sicherung fehlgeschlagen."));
    return;
  }
  else if (a === "import"){ document.getElementById("file").click(); return; }
  else if (a === "print"){
    const dd = gefiltert(d);
    if (!dd.sessions.length){ toast("Im gewählten Zeitraum gibt es keine Sitzungen."); return; }
    buildReport(dd); window.print(); return;
  }
  else if (a === "report"){
    (async () => {
      const dd = gefiltert(d);
      if (!dd.sessions.length){ toast("Im gewählten Zeitraum gibt es keine Sitzungen."); return; }
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([await reportMitBildern(dd)], {type:"text/html;charset=utf-8"}));
      link.download = `therapieblatt-${d.name.replace(/[^\wäöüÄÖÜ-]+/g,"_")}-${today()}.html`;
      link.click();
      toast("Therapieblatt gespeichert. Öffnen und mit Drucken als PDF ausgeben.");
    })().catch(() => toast("Therapieblatt konnte nicht erstellt werden."));
    return;
  }
  render();
});

document.addEventListener("input", e => {
  const rg = e.target.closest("[data-range]");
  if (rg){
    rg.value = maskDate(rg.value);
    const iso = deToIso(rg.value);
    range[rg.dataset.range] = rg.value === "" ? "" : (iso || range[rg.dataset.range]);
    const info = rg.closest(".panel").querySelector(".hint");
    if (info && cur()) info.textContent = rangeInfo(cur());
    return;
  }
  const dt = e.target.closest("[data-date]");
  if (dt && draft){
    const pos = dt.selectionStart === dt.value.length;
    dt.value = maskDate(dt.value);
    if (pos) dt.selectionStart = dt.selectionEnd = dt.value.length;
    const err = document.querySelector(`[data-err="${dt.dataset.date}"]`);
    const iso = deToIso(dt.value);
    if (iso){
      draft[dt.dataset.date] = iso;
      const warn = (dt.dataset.date === "datum" && cur()) ? datumHinweis(draft, cur()) : "";
      err.textContent = warn || "Format tt.mm.jjjj";
      err.classList.toggle("err", !!warn);
      live();
    } else if (dt.value === ""){
      draft[dt.dataset.date] = "";
      err.textContent = "Format tt.mm.jjjj"; err.classList.remove("err");
    } else {
      err.textContent = dt.value.length < 10 ? "Weiter tippen: tt.mm.jjjj" : "Kein gültiges Datum";
      err.classList.add("err");
    }
    return;
  }
  const el = e.target.closest("[data-set]");
  if (!el || !draft) return;
  const attr = el.dataset.set;
  const val = el.type === "range" ? Number(el.value) : el.value;
  setField(attr, val);
  if (el.type === "range"){
    const out = document.querySelector(`[data-out="${attr}"]`);
    if (out) out.textContent = nf(val) + (el.dataset.unit || "");
    const m = /^(\d+)\.(dauer|pause)$/.exec(attr);
    if (m){
      const k = m[1] + ":" + (m[2] === "dauer" ? "run" : "rest");
      const goal = document.querySelector(`[data-goal="${k}"]`);
      if (goal) goal.textContent = `${m[2] === "dauer" ? "Laufzeit" : "Pause"} · Ziel ${val} min`;
      const uhr = document.querySelector(`[data-t="${k}"]`);
      if (uhr) uhr.textContent = restText(k);
      tAlarm[k] = tSec(k) >= tSoll(k);
    }
  }
  live();
});
document.addEventListener("change", e => {
  const sg = e.target.closest("[data-sig]");
  if (sg){ signal[sg.dataset.sig] = sg.checked; signalSave(); return; }
  const cal = e.target.closest("[data-cal]");
  if (cal && draft){
    const iso = cal.value;
    if (!iso) return;
    const attr = cal.dataset.cal;
    draft[attr] = iso;
    const txt = document.querySelector(`[data-date="${attr}"]`);
    if (txt) txt.value = de(iso);
    const err = document.querySelector(`[data-err="${attr}"]`);
    if (err){
      const warn = (attr === "datum" && cur()) ? datumHinweis(draft, cur()) : "";
      err.textContent = warn || "Format tt.mm.jjjj oder Kalender";
      err.classList.toggle("err", !!warn);
    }
    live(); return;
  }
  const calr = e.target.closest("[data-calrange]");
  if (calr){
    range[calr.dataset.calrange] = calr.value || "";
    render(); return;
  }
  const cb = e.target.closest("[data-check]");
  if (cb && draft){ draft[cb.dataset.check] = cb.checked; return; }
  const el = e.target.closest("select[data-set]");
  if (el && draft){ setField(el.dataset.set, el.value); render(); }
});

document.getElementById("file").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const roh = JSON.parse(await f.text());
    const list = Array.isArray(roh) ? roh : roh.hunde;          // altes Format war eine reine Liste
    const bilder = Array.isArray(roh) ? {} : (roh.bilder || {});
    if (!Array.isArray(list)) throw new Error("Format");
    const anzBild = Object.keys(bilder).length;
    const before = dogs;
    toast(`${list.length} Hunde, ${anzBild} Bilder in der Datei. Der Bestand auf diesem Gerät wird ersetzt.`, [
      {label:"Ersetzen", run(){
        (async () => {
          dogs = list; sel = dogs[0] ? dogs[0].id : null; save(); mode = "view"; render();
          for (const [id, data] of Object.entries(bilder)){
            try { await shotPut(id, await dataToBlob(data)); shotForget(id); } catch {}
          }
          render();
          toast("Daten geladen.", [{label:"Rückgängig", run(){
            dogs = before; sel = dogs[0] ? dogs[0].id : null; save(); render();
          }}]);
        })();
      }},
      {label:"Abbrechen", run(){}}
    ]);
  } catch { toast("Datei nicht lesbar. Erwartet wird eine Sicherung aus dieser App."); }
  e.target.value = "";
});

/* Foto: auf 320 px gerechnet und als JPEG komprimiert, damit der Speicher reicht. */
/* CSV zurueckspielen: ergaenzt fehlende Sitzungen, ueberschreibt nie bestehende. */
function csvEinlesen(text){
  const zeilen = text.replace(/^\uFEFF/, "").split(/\r?\n/).filter(z => z.trim());
  if (zeilen.length < 2) throw new Error("leer");
  const teile = z => {
    const out = []; let cur2 = "", q = false;
    for (let i = 0; i < z.length; i++){
      const c = z[i];
      if (q){ if (c === '"' && z[i+1] === '"'){ cur2 += '"'; i++; } else if (c === '"') q = false; else cur2 += c; }
      else if (c === '"') q = true;
      else if (c === ";"){ out.push(cur2); cur2 = ""; }
      else cur2 += c;
    }
    out.push(cur2); return out;
  };
  const kopf = teile(zeilen[0]).map(x => x.trim());
  const sp = name => kopf.indexOf(name);
  const noetig = ["Hund","Datum"];
  if (noetig.some(n => sp(n) < 0)) throw new Error("Spalten fehlen");
  const zahl = v => { const x = String(v||"").replace(",", ".").trim(); return x === "" ? null : Number(x); };

  let neu = 0, schon = 0, fehler = 0;
  for (const z of zeilen.slice(1)){
    const f = teile(z);
    const name = (f[sp("Hund")]||"").trim();
    const iso = deToIso(f[sp("Datum")]||"");
    if (!name || !iso){ fehler++; continue; }
    let d = dogs.find(x => x.name.toLowerCase() === name.toLowerCase());
    if (!d){
      d = newDog(); d.name = name;
      if (sp("Rasse") >= 0) d.rasse = (f[sp("Rasse")]||"").trim();
      dogs.push(d);
    }
    if (d.sessions.some(x => x.datum === iso)){ schon++; continue; }
    const blocks = [];
    for (let i = 1; i <= 3; i++){
      const v = zahl(f[sp(`E${i} km/h`)]);
      if (v == null) continue;
      blocks.push({
        speed: v * 2,
        steigung: zahl(f[sp(`E${i} Steigung %`)]) ?? 0,
        dauer: zahl(f[sp(`E${i} Dauer min`)]) ?? 1,
        pause: zahl(f[sp(`E${i} Pause min`)]) ?? 0
      });
    }
    if (!blocks.length){ fehler++; continue; }
    d.sessions.push({
      id: uid(), datum: iso,
      gewicht: sp("Gewicht kg") >= 0 ? (f[sp("Gewicht kg")]||"").replace(",", ".") : "",
      therapeut: sp("Behandelt durch") >= 0 ? (f[sp("Behandelt durch")]||"") : "",
      laufbandhoehe: zahl(f[sp("Band")]) ?? d.laufbandhoehe,
      wasserhoehe: zahl(f[sp("Wasser")]) ?? d.wasserhoehe,
      gegenstrom: sp("Gegenstrom") >= 0 && /^(ja|true|1|x)$/i.test((f[sp("Gegenstrom")]||"").trim()),
      blocks,
      bemerkungen: sp("Bemerkungen") >= 0 ? (f[sp("Bemerkungen")]||"") : ""
    });
    neu++;
  }
  return {neu, schon, fehler};
}

document.getElementById("csv").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  const sicherung = JSON.parse(JSON.stringify(dogs));
  try {
    const r = csvEinlesen(await f.text());
    if (!r.neu){ dogs = sicherung; toast(`Nichts eingelesen. ${r.schon} Sitzungen waren bereits vorhanden, ${r.fehler} Zeilen unbrauchbar.`); return; }
    save(); if (!sel && dogs.length) sel = dogs[0].id;
    render();
    toast(`${r.neu} Sitzungen eingelesen, ${r.schon} bereits vorhanden, ${r.fehler} übersprungen.`,
      [{label:"Rückgängig", run(){ dogs = sicherung; save(); render(); }}]);
  } catch (err){
    dogs = sicherung;
    toast("CSV nicht lesbar. Erwartet wird eine Datei aus dem Export dieser App.");
  }
});

document.getElementById("lightbox").addEventListener("click", e => {
  e.currentTarget.classList.remove("on");
});

async function shotGewaehlt(e){
  const f = e.target.files[0]; e.target.value = "";
  if (!f || !draft) return;
  try {
    const blob = await shrink(f, 800, 0.68);
    await shotPut(draft.id, blob);
    shotForget(draft.id);
    draft.bild = true;
    render();
    toast(`Bild gespeichert, ${Math.round(blob.size/1024)} KB.`);
  } catch (err){
    toast("Bild konnte nicht gespeichert werden. Speicher voll oder Format unbekannt.");
  }
}
["shot","shotCam"].forEach(id => document.getElementById(id).addEventListener("change", shotGewaehlt));

function fotoGewaehlt(e){
  const f = e.target.files[0]; if (!f || !draft) return;
  const img = new Image();
  img.onload = () => {
    const S = 320, cv = document.createElement("canvas");
    cv.width = S; cv.height = S;
    const side = Math.min(img.width, img.height);
    cv.getContext("2d").drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, S, S);
    draft.foto = cv.toDataURL("image/jpeg", 0.72);
    draft.bildwahl = "foto";
    URL.revokeObjectURL(img.src);
    render();
  };
  img.onerror = () => toast("Das Bild konnte nicht gelesen werden.");
  img.src = URL.createObjectURL(f);
  e.target.value = "";
}
["photo","photoCam"].forEach(id => document.getElementById(id).addEventListener("change", fotoGewaehlt));

load();
if (dogs.length) tab = "erfassen";
render();
shotKeys().then(keys => {
  const gueltig = new Set(dogs.flatMap(d => d.sessions.map(x => x.id)));
  keys.filter(k => !gueltig.has(k)).forEach(k => shotDel(k).catch(()=>{}));
}).catch(()=>{});
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
